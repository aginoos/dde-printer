<?xml version="1.0" encoding="UTF-8"?> <!-- -*- XML -*- -->

<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>

  <!-- Only root can own the service name -->
  <policy user="root">
    <allow own="com.deepin.printer.manager"/>
    <allow send_destination="com.deepin.printer.manager"/>
  </policy>

  <!-- Everyone may call the service; the service itself asks polkit
       before doing anything privileged. -->
  <policy context="default">
    <deny own="com.deepin.printer.manager"/>

    <allow send_destination="com.deepin.printer.manager"
           send_interface="com.deepin.printer.manager"/>
    <allow send_destination="com.deepin.printer.manager"
           send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="com.deepin.printer.manager"
           send_interface="org.freedesktop.DBus.Peer"/>
  </policy>

</busconfig>
